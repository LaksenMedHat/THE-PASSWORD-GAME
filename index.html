<title>The (New and improved) Password Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one floating column over a pixelated swirl; HUD → field → stacked rule cards. Single dark arcade look. */
:root {
  --night: #120f2a;
  --panel: #221d47;
  --panel-hi: #2d2762;
  --edge: #0a0817;
  --ink: #f6f0ff;
  --dim: #aca2db;
  --red: #ff4d5e;
  --blue: #2f8bff;
  --gold: #ffb83d;
  --good: #3ddc8f;
  --good-bg: #173d39;
  --bad: #ff6070;
  --display: 'Jersey 15', 'Courier New', monospace;
  --body: 'Space Mono', 'Courier New', ui-monospace, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--body); font-size: 16px;
  overflow-x: hidden;
}
canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#bg { z-index: 0; }
#fx { z-index: 1; pointer-events: none; }
.scan { position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 2px, transparent 2px 4px);
  mix-blend-mode: multiply; }
.vig { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(5,3,15,.55) 100%); }

#app { position: relative; z-index: 3; min-height: 100%; padding-inline: 16px; padding-block: 64px 48px; box-sizing: border-box; }
.screen { max-width: 760px; margin: 0 auto; }

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.btn {
  font-family: var(--display); font-size: 30px; letter-spacing: .04em; line-height: 1;
  padding: .45em 1.1em .5em; border: 3px solid var(--edge); border-radius: 10px;
  background: var(--blue); color: var(--ink); box-shadow: 0 6px 0 var(--edge);
  transition: transform .08s, box-shadow .08s; text-shadow: 0 3px 0 rgba(0,0,0,.35);
}
.btn:hover { transform: translateY(-2px) rotate(-1deg); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--edge); }
.btn.red { background: var(--red); }
.btn.gold { background: var(--gold); color: var(--edge); text-shadow: none; }
.btn.dark { background: var(--panel-hi); }
.btn small { font-family: var(--body); font-size: 14px; opacity: .85; margin-left: .5em; letter-spacing: 0; }

/* ---------- menu ---------- */
#menu { display: flex; flex-direction: column; align-items: center; gap: 28px; padding-top: min(8vh, 64px); }
.logo { margin: 0; text-align: center; font-family: var(--display); font-weight: 400; line-height: .82; display: grid; justify-items: center; }
.logo .the { font-size: clamp(26px, 5vw, 40px); letter-spacing: .3em; color: var(--dim); }
.logo .big { font-size: clamp(64px, 17vw, 150px); letter-spacing: .02em; color: var(--ink);
  text-shadow: 0 6px 0 var(--edge), 0 0 0 transparent; animation: wob 4s ease-in-out infinite; display: block; }
.logo .sticker {
  font-family: var(--body); font-weight: 700; font-size: clamp(16px, 3.4vw, 24px); color: var(--edge);
  background: var(--gold); padding: .25em .7em; border: 3px solid var(--edge); border-radius: 8px;
  transform: rotate(-6deg); box-shadow: 0 5px 0 var(--edge); margin: 6px 0 10px; position: relative; z-index: 1;
  animation: stick 2.6s ease-in-out infinite;
}
@keyframes wob { 0%,100% { transform: rotate(-1.2deg) translateY(0); } 50% { transform: rotate(1.2deg) translateY(-4px); } }
@keyframes stick { 0%,100% { transform: rotate(-6deg) scale(1); } 50% { transform: rotate(-3deg) scale(1.05); } }
.menu-btns { display: grid; gap: 14px; width: min(100%, 360px); }
.menu-btns .btn { width: 100%; }
.menu-btns .btn.red { font-size: 44px; }
.menu-foot { color: var(--dim); font-size: 13px; text-align: center; max-width: 40ch; }

.audiopop { position: fixed; top: calc(62px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 7; width: 260px; max-width: calc(100vw - 24px); background: var(--panel); border: 3px solid var(--edge); border-radius: 10px; padding: 12px 14px 14px; box-shadow: 0 6px 0 rgba(0,0,0,.45); display: grid; gap: 10px; }
.audiopop[hidden] { display: none; }
.ap-title { letter-spacing: .2em; color: var(--gold); font-size: 13px; }
.ap-row { display: grid; grid-template-columns: 64px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .1em; color: var(--dim); }
.ap-row output { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.ap-row input { width: 100%; accent-color: var(--gold); }
.audiopop .btn { font-size: 14px; padding: 8px; }
.corners { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 6; display: flex; gap: 8px; }
.quit { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 6; }
.quit.corner { color: var(--bad); }
.corner {
  font-family: var(--display); font-size: 20px; padding: .3em .7em; border: 3px solid var(--edge); border-radius: 8px;
  background: var(--panel); box-shadow: 0 4px 0 var(--edge); color: var(--ink); }

/* ---------- game ---------- */
.mini-title { text-align: center; font-family: var(--display); font-size: clamp(22px, 4.6vw, 34px); color: var(--dim); letter-spacing: .04em; margin: 0 0 10px; }
.mini-title span { color: var(--gold); }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; margin: 18px 0 10px; }
.hud small { display: block; font-size: 12px; letter-spacing: .14em; color: var(--dim); }
.hud b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.hud-score { text-align: right; }
.hud-time b { font-size: clamp(64px, 14vw, 96px); display: block; text-shadow: 0 5px 0 var(--edge); transition: color .3s; }
.hud-time.hurry b { animation: shake .35s infinite; }
@keyframes shake { 0%,100% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-2px,1px) rotate(-1deg); } 75% { transform: translate(2px,-1px) rotate(1deg); } }
.hud-score b.bump { animation: bump .4s; display: inline-block; }
@keyframes bump { 40% { transform: scale(1.3); color: var(--gold); } }

.field { position: relative; animation: hover 3.4s ease-in-out infinite; }
@keyframes hover { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
#pw {
  display: block; width: 100%; box-sizing: border-box; resize: none; overflow: hidden;
  font-family: var(--body); font-size: clamp(20px, 3.6vw, 28px); line-height: 1.35; color: var(--ink);
  background: var(--panel); border: 4px solid var(--edge); border-radius: 12px; padding: 16px 18px;
  box-shadow: 0 8px 0 var(--edge), inset 0 0 0 2px rgba(255,255,255,.05);
  caret-color: var(--gold); word-break: break-all; min-height: 72px;
}
#pw:focus { outline: none; box-shadow: 0 8px 0 var(--edge), inset 0 0 0 2px var(--gold); }
#pw::placeholder { color: var(--dim); opacity: .7; }
.field-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; font-size: 14px; color: var(--dim); }
.field-foot .len { font-variant-numeric: tabular-nums; }
#lock { font-family: var(--display); font-size: 24px; padding: .3em .9em .35em; border: 3px solid var(--edge); border-radius: 8px; background: var(--panel-hi); color: var(--dim); box-shadow: 0 4px 0 var(--edge); }
#lock.ready { background: var(--good); color: var(--edge); animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06) rotate(-1deg); } }
#game.shake-x .field { animation: no .3s; }
@keyframes no { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }

#rules { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 12px; }
.rule {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  background: var(--panel); border: 3px solid var(--edge); border-radius: 10px; padding: 12px 14px;
  box-shadow: 0 5px 0 var(--edge); position: relative;
}
.rule .num { font-family: var(--display); font-size: 22px; line-height: 1; background: var(--red); color: var(--ink);
  border: 3px solid var(--edge); border-radius: 7px; padding: 4px 8px 5px; min-width: 2.2em; text-align: center; }
.rule .txt { min-width: 0; }
.rule .txt p { margin: 0; font-size: 17px; line-height: 1.3; }
.rule .txt .hint { margin-top: 4px; font-size: 13px; color: var(--dim); }
.rule .mark { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--bad); width: 1em; text-align: center; }
.rule.ok { background: var(--good-bg); }
.rule.ok .num { background: var(--good); color: var(--edge); }
.rule.ok .mark { color: var(--good); }
.rule.new { animation: drop .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes drop { 0% { transform: translateY(-24px) rotate(-3deg) scale(.9); opacity: 0; } 100% { transform: none; opacity: 1; } }
.rule.pop { animation: pop .5s cubic-bezier(.3,1.8,.5,1); }
@keyframes pop { 0% { transform: scale(1); } 30% { transform: scale(1.06) rotate(-1.2deg); } 60% { transform: scale(.97) rotate(.8deg); } 100% { transform: scale(1) rotate(0); } }

/* ---------- floating score popup ---------- */
#burst { position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; pointer-events: none; }
#burst .card {
  background: var(--panel); border: 4px solid var(--edge); border-radius: 14px; box-shadow: 0 10px 0 var(--edge);
  padding: 22px 30px; text-align: center; animation: drop .5s cubic-bezier(.2,1.6,.4,1); transform: rotate(-2deg);
}
#burst h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; color: var(--dim); letter-spacing: .06em; }
#burst .pts { font-family: var(--display); font-size: 92px; line-height: .9; color: var(--gold); text-shadow: 0 6px 0 var(--edge); }
#burst .why { font-size: 14px; color: var(--dim); margin-top: 8px; font-variant-numeric: tabular-nums; }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; z-index: 8; background: rgba(6,4,16,.72); display: grid; place-items: start center; overflow-y: auto; padding-inline: 16px; padding-block: calc(24px + env(safe-area-inset-top, 0px)) 40px; }
.sheet {
  width: min(100%, 680px); box-sizing: border-box; background: var(--panel); border: 4px solid var(--edge); border-radius: 14px;
  box-shadow: 0 10px 0 var(--edge); padding: 22px 22px 24px; animation: drop .4s cubic-bezier(.2,1.6,.4,1);
}
.sheet h2.result { text-transform: uppercase; }
.sheet h2.result.long { font-size: 40px; line-height: .95; }
.sheet h3 .meta { font-family: var(--body); font-size: 14px; color: var(--dim); margin-left: 8px; }
.runline { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.runline span { background: var(--edge); border-radius: 8px; padding: 8px 12px; }
.runline small { display: block; font-size: 11px; letter-spacing: .14em; color: var(--dim); }
.runline b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.warn { background: var(--edge); border-left: 6px solid var(--bad); border-radius: 8px; padding: 12px 14px; }
.warn b { color: var(--bad); }
.sheet h2 { margin: 0 0 12px; font-family: var(--display); font-weight: 400; font-size: 52px; line-height: .9; letter-spacing: .03em; text-wrap: balance; }
.sheet h3 { margin: 18px 0 8px; font-family: var(--display); font-weight: 400; font-size: 28px; color: var(--gold); }
.sheet p, .sheet li { line-height: 1.5; font-size: 15px; }
.sheet ol, .sheet ul { padding-left: 1.2em; margin: 0; }
.sheet .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
.sheet .formula { font-family: var(--display); font-size: 24px; background: var(--edge); border-radius: 8px; padding: 10px 14px; color: var(--gold); line-height: 1.15; }
.big-score { font-family: var(--display); font-size: 96px; line-height: .9; color: var(--gold); text-shadow: 0 6px 0 var(--edge); }
.final-pw { font-size: 20px; background: var(--edge); border-radius: 10px; padding: 14px 16px; word-break: break-all; line-height: 1.4; }
.tag { display: inline-block; font-family: var(--display); font-size: 20px; background: var(--red); border: 3px solid var(--edge); border-radius: 6px; padding: 2px 10px; transform: rotate(-4deg); }
table.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.tbl th { text-align: left; color: var(--dim); font-weight: 400; font-size: 12px; letter-spacing: .12em; padding: 6px 8px; border-bottom: 2px solid var(--edge); }
.tbl td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
.tbl td.pwcell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
.tbl-wrap { overflow-x: auto; }
.failed { display: grid; gap: 10px; }
.failed div { background: var(--edge); border-radius: 8px; padding: 10px 12px; }
.failed b { color: var(--bad); font-weight: 600; }
.failed span { display: block; font-size: 13px; color: var(--dim); margin-top: 4px; }

.disc { display: grid; gap: 8px; }
.disc-item { background: var(--edge); border-radius: 8px; padding: 10px 12px; }
.disc-item header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.disc-item header span { min-width: 0; }
.disc-item.locked header span { color: var(--dim); letter-spacing: .2em; }
.disc-item button { font-size: 12px; background: var(--panel-hi); border: 2px solid var(--panel); border-radius: 6px; padding: 4px 8px; white-space: nowrap; }
.answers { margin-top: 10px; font-size: 13px; color: var(--dim); line-height: 1.55; max-height: 220px; overflow-y: auto; }
.answers p { margin: 0 0 6px; font-size: 13px; line-height: 1.5; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--edge); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.stat small { display: block; font-size: 12px; letter-spacing: .12em; color: var(--dim); }
.stat b { overflow-wrap: anywhere; display: block; font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; color: var(--gold); margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat span { display: block; font-size: 13px; color: var(--dim); margin-top: 4px; }
.stat code { display: block; font-family: var(--body); font-size: 13px; color: var(--ink); margin-top: 6px; word-break: break-all; max-height: 7.5em; overflow-y: auto; }
.achs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ach { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--edge); border: 0; border-radius: 10px; padding: 10px 12px; min-width: 0; font: inherit; color: var(--ink); }
.ach .ach-txt { min-width: 0; }
.ach b { display: block; font-size: 15px; line-height: 1.25; }
.ach span { display: block; font-size: 13px; color: var(--dim); margin-top: 3px; line-height: 1.35; }
.ach em { display: block; font-style: normal; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-top: 5px; }
.ach.locked .hov { display: none; color: var(--gold); }
.ach.locked:hover .q, .ach.locked:focus-visible .q { display: none; }
.ach.locked:hover .hov, .ach.locked:focus-visible .hov { display: block; }
.ach.locked .q { letter-spacing: .3em; color: var(--dim); }
.ach.revealed em { color: var(--dim); }
.emblem { width: 52px; height: 57px; display: block; }
.emblem .hex-shadow { fill: #000; opacity: .45; }
.emblem .hex { fill: #3a3466; stroke: var(--edge); stroke-width: 2; }
.emblem .hex-in { fill: #2a2550; }
.emblem .px { fill: #6d65a0; }
.emblem.on .hex { fill: var(--gold); }
.emblem.on .hex-in { fill: #c9771d; }
.emblem.on .px { fill: #fff6dc; }
#toasts { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 25; display: grid; gap: 10px; width: min(calc(100% - 32px), 420px); pointer-events: none; }
.toast.info { grid-template-columns: 1fr; }
.toast { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; background: var(--panel); border: 4px solid var(--edge); border-radius: 12px; box-shadow: 0 8px 0 var(--edge); padding: 10px 14px; animation: rise .5s cubic-bezier(.2,1.6,.4,1); }
.toast small { display: block; font-size: 11px; letter-spacing: .14em; color: var(--gold); }
.toast b { display: block; font-size: 16px; line-height: 1.25; margin-top: 2px; }
.toast span { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
.toast.out { animation: sink .4s ease-in forwards; }
@keyframes rise { 0% { transform: translateY(120%) rotate(3deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes sink { to { transform: translateY(140%); opacity: 0; } }
/* ---------- tiers ---------- */
.t-locked { --ta: #24204a; --tb: #36306a; --tc: #4a4486; --ti: #8f87c2; }
.t-bronze { --ta: #6e3d17; --tb: #c98544; --tc: #f3c08c; --ti: #2a1405; }
.t-copper { --ta: #74250f; --tb: #d0663b; --tc: #ffb08c; --ti: #2a0d04; }
.t-silver { --ta: #5b6470; --tb: #b9c2cc; --tc: #f6f9fc; --ti: #1d232a; }
.t-gold { --ta: #8a5a06; --tb: #e7b52c; --tc: #fff2a8; --ti: #2b1c00; }
.t-platinum { --ta: #587080; --tb: #cddde6; --tc: #ffffff; --ti: #172a35; }
.t-diamond { --ta: #1f86ad; --tb: #8fe6ff; --tc: #f0fdff; --ti: #052a36; }
.t-emerald { --ta: #0a5a35; --tb: #22c27a; --tc: #aaffd6; --ti: #02210f; }
.t-ruby { --ta: #6b0920; --tb: #e0284f; --tc: #ffadc0; --ti: #ffffff; }
.t-sapphire { --ta: #0f2672; --tb: #2f63e8; --tc: #a8c4ff; --ti: #ffffff; }
.t-prismatic { --ta: #8f7bd6; --tb: #e7dcff; --tc: #ffffff; --ti: #241a52; }
.t-rainbow { --ta: #ff4d5e; --tb: #ffb83d; --tc: #fff; --ti: #ffffff; }
.tier-fill { background: linear-gradient(140deg, var(--tc) 0%, var(--tb) 42%, var(--ta) 100%); color: var(--ti); }
.tier-fill.t-prismatic { background: conic-gradient(from 40deg, #ffd6f2, #c7f4ff, #e4d2ff, #d2ffe9, #fff3c6, #ffd6f2); }
.tier-fill.t-rainbow { position: relative; overflow: hidden; isolation: isolate; background: #a35bff; text-shadow: 0 1px 0 rgba(0,0,0,.5); }
.tier-fill.t-rainbow::before { content: ''; position: absolute; inset: -75%; z-index: -1;
  background: conic-gradient(#ff4d5e, #ff9f3d, #ffe85a, #3ddc8f, #2fd0ff, #2f6bff, #a35bff, #ff4d9e, #ff4d5e);
  animation: swirl 18s linear infinite; }
@keyframes swirl { to { transform: rotate(1turn); } }

/* ---------- medals & level ---------- */
.pxi { width: 26px; height: 26px; fill: currentColor; opacity: .82; display: block; }
.medal { display: grid; justify-items: center; text-align: center; gap: 3px; min-width: 0; }
.medal .ribbon { display: flex; gap: 4px; height: 16px; margin-bottom: -6px; }
.medal .ribbon i { width: 12px; height: 16px; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%); filter: brightness(.75); }
.medal .disc { width: 62px; height: 62px; border-radius: 50%; border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--edge), inset 0 0 0 3px rgba(255,255,255,.28); display: grid; place-items: center; position: relative; }
.medal .disc .lv { position: absolute; right: -6px; bottom: -4px; background: var(--edge); color: var(--ink); font-family: var(--display); font-size: 18px; line-height: 1; border-radius: 6px; padding: 2px 5px 3px; min-width: 1.2em; }
.medal b { font-size: 13px; margin-top: 6px; }
.medal .tier-name { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.medal small { font-size: 10.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.mbar, .xpbar { width: 100%; height: 6px; background: var(--edge); border-radius: 4px; overflow: hidden; }
.mbar i, .xpbar i { display: block; height: 100%; background: var(--good); border-radius: 4px; }
.medal-mini .disc { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--edge); display: grid; place-items: center; }
.medal-mini .pxi { width: 20px; height: 20px; }
.lvl-badge { width: 76px; height: 84px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); display: grid; place-content: center; text-align: center; flex: none; }
.lvl-badge small { font-size: 11px; letter-spacing: .14em; font-weight: 700; opacity: .8; }
.lvl-badge b { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: .85; }
.lvl-badge.mini { width: 46px; height: 52px; }
.lvl-badge.mini small { font-size: 8px; }
.lvl-badge.mini b { font-size: 24px; }

/* ---------- account screen ---------- */
#account.screen { max-width: 1120px; }
.acc-head { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 32px; align-items: start;
  background: var(--panel); border: 4px solid var(--edge); border-radius: 14px; box-shadow: 0 8px 0 var(--edge); padding: 20px 22px; }
.acc-left { min-width: 0; display: grid; gap: 4px; justify-items: start; align-content: start; }
.acc-right { min-width: 0; display: grid; gap: 20px; }
.acc-label { display: block; font-size: 11px; letter-spacing: .16em; color: var(--dim); }
.acc-name { font-family: var(--display); font-size: clamp(44px, 6.4vw, 76px); line-height: .95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.acc-titletext { font-size: 17px; font-weight: 700; color: var(--ink); min-height: 1.3em; }
.acc-titletext.none { color: var(--dim); font-weight: 400; font-size: 14px; }
.edit-btn { margin-top: 10px; }
.acc-edit { display: grid; gap: 10px; width: 100%; margin-top: 10px; background: var(--edge); border-radius: 10px; padding: 14px; box-sizing: border-box; }
.acc-field { display: grid; gap: 4px; min-width: 0; }
.acc-field input, .acc-field select { font: inherit; font-size: 18px; color: var(--ink); background: var(--panel); border: 3px solid var(--panel-hi); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; box-sizing: border-box; }
.acc-field input:focus, .acc-field select:focus { border-color: var(--gold); outline: none; }
.acc-why { margin: 0; font-size: 13px; color: var(--dim); line-height: 1.45; }
.acc-why b { color: var(--gold); }
.acc-edit-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn.small { font-size: 22px; padding: .3em .8em .35em; box-shadow: 0 4px 0 var(--edge); }
.acc-lvl { display: flex; gap: 14px; align-items: center; min-width: 0; }
.lvl-txt { display: grid; gap: 4px; min-width: 0; flex: 1; }
.lvl-txt b { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1; }
.lvl-txt span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.lvl-txt small { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.acc-medals { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.btn { position: relative; }
.dot { position: absolute; top: -10px; right: -10px; width: 28px; height: 28px; display: grid; place-items: center; background: var(--red); color: #fff; border: 3px solid var(--edge); border-radius: 50%;
  font-family: var(--display); font-size: 22px; line-height: 1; text-shadow: none; box-shadow: 0 3px 0 var(--edge); animation: dotpop 1.6s ease-in-out infinite; }
@keyframes dotpop { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.15) rotate(8deg); } }
.newtag { display: inline-block; font-family: var(--display); font-size: 15px; line-height: 1; background: var(--red); color: #fff; border-radius: 5px; padding: 2px 6px 3px; margin-left: 8px; vertical-align: 2px; }
.ach .newtag, .disc-item .newtag { display: inline-block; margin-top: 0; color: #fff; font-size: 14px; letter-spacing: 0; }
.bang { width: 44px; height: 44px; display: grid; place-items: center; background: var(--red); color: #fff; border: 3px solid var(--edge); border-radius: 50%; font-family: var(--display); font-size: 32px; }
.acc-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 22px; align-items: start; }
.acc-col { background: var(--panel); border: 4px solid var(--edge); border-radius: 14px; box-shadow: 0 8px 0 var(--edge); padding: 16px 16px 18px; min-width: 0; }
.acc-col h3 { margin: 0 0 12px; font-family: var(--display); font-weight: 400; font-size: 34px; color: var(--gold); display: flex; justify-content: space-between; align-items: baseline; }
.acc-col h3 small { font-family: var(--body); font-size: 14px; color: var(--dim); }
.achs.one { grid-template-columns: 1fr; max-height: 640px; overflow-y: auto; padding-right: 4px; }
.acc-col .stats { max-height: none; }
.acc-col .stat b { font-size: 36px; }
.note { margin-top: 12px; }
.acc-foot { display: flex; justify-content: center; margin-top: 24px; }
.menu-player { margin: -10px 0 0; color: var(--dim); font-size: 14px; text-align: center; }
.menu-player b { color: var(--ink); }

/* ---------- XP line on result screens ---------- */
.xpline { display: flex; gap: 12px; align-items: center; background: var(--edge); border-radius: 10px; padding: 10px 14px; margin-top: 10px; }
.xp-txt { display: grid; gap: 4px; min-width: 0; flex: 1; }
.xp-txt b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--good); }
.xp-txt span, .xp-txt small { font-size: 12px; color: var(--dim); }

/* ---------- toasts with art ---------- */
.toast .toast-art { display: grid; place-items: center; }

/* ---------- tutorial ---------- */
#tour { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
#tour .tb { position: fixed; background: rgba(6, 4, 16, .66); pointer-events: auto; }
#tour .tb.hole { background: transparent; }
.tour-ring { position: fixed; border: 3px solid var(--gold); border-radius: 12px; box-shadow: 0 0 0 4px rgba(255, 184, 61, .25), 0 0 24px rgba(255, 184, 61, .45); pointer-events: none; animation: ringpulse 1.4s ease-in-out infinite; }
@keyframes ringpulse { 50% { box-shadow: 0 0 0 8px rgba(255, 184, 61, .12), 0 0 34px rgba(255, 184, 61, .6); } }
.tour-bubble { position: fixed; width: min(380px, calc(100vw - 24px)); box-sizing: border-box; pointer-events: auto; background: var(--panel); border: 4px solid var(--edge); border-radius: 12px; box-shadow: 0 8px 0 var(--edge); padding: 16px 16px 14px; }
.tour-text { font-size: 15px; line-height: 1.5; }
.tour-text b { color: var(--gold); }
.tour-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.tour-skip { background: none; border: 0; padding: 4px 0; color: var(--dim); font-size: 13px; text-decoration: underline; }
.tour-wait { font-size: 13px; color: var(--gold); animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* ---------- victory juice ---------- */
.sheet.slide { animation: slidedown .7s cubic-bezier(.2, 1.35, .45, 1) both; }
@keyframes slidedown { 0% { transform: translateY(-115vh) rotate(-3deg); } 100% { transform: none; } }
.skiphint { position: absolute; top: 10px; right: 14px; font-size: 12px; color: var(--dim); letter-spacing: .08em; animation: blink 1.2s steps(2) infinite; }
.sheet { position: relative; }
.prog { min-width: 0; margin-top: 14px; background: var(--edge); border-radius: 12px; padding: 14px; display: grid; gap: 14px; }
.prog-lvl { display: flex; align-items: center; gap: 14px; position: relative; }
.prog-txt { display: grid; gap: 5px; flex: 1; min-width: 0; }
.prog-txt b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; }
.prog-txt small { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.xpbar.big { height: 12px; border-radius: 6px; }
.xpbar.big i { background: linear-gradient(90deg, var(--good), #a8ffcf); border-radius: 6px; }
.prog-gain { font-family: var(--display); font-size: 34px; color: var(--good); line-height: 1; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .35s cubic-bezier(.3, 1.8, .5, 1); }
.prog-gain.on { opacity: 1; transform: scale(1); }
.prog-medals { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; min-height: 150px; }
.prog-medals .medal { opacity: 0; transform: scale(.3) translateY(-16px); }
.prog-medals .medal.in { opacity: 1; transform: none; transition: transform .35s cubic-bezier(.3, 1.8, .5, 1), opacity .15s; }
.prog .mbar { background: var(--panel-hi); }
.prog-medals .newtitle { font-size: 11px; color: var(--good); font-weight: 700; }
.lvl-badge.bump, .medal .disc.bump { animation: bump2 .45s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes bump2 { 40% { transform: scale(1.3) rotate(-6deg); } }
.xp-fly { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; font-family: var(--display); font-size: 44px; color: var(--good); text-shadow: 0 4px 0 var(--edge); white-space: nowrap; }
.xp-bit { position: fixed; left: 0; top: 0; z-index: 30; width: 8px; height: 8px; background: var(--good); pointer-events: none; box-shadow: 0 2px 0 var(--edge); }
.wave { position: absolute; inset: 0; pointer-events: none; box-sizing: border-box; border: 4px solid transparent; padding: 16px 18px; font-family: var(--body); font-size: clamp(20px, 3.6vw, 28px); line-height: 1.35; color: var(--ink); word-break: break-all; white-space: pre-wrap; }
.wave span { display: inline-block; animation: wave .5s cubic-bezier(.3, 1.6, .5, 1) both; white-space: pre; }
@keyframes wave { 0% { transform: translateY(0); } 40% { transform: translateY(-14px) scale(1.15); color: var(--gold); } 100% { transform: translateY(0); } }
#pw.waving { color: transparent; }

/* ---------- online ---------- */
.btn.mpbtn { background: var(--good); color: var(--edge); text-shadow: none; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none !important; }
.lobby-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.lobby-card { background: var(--edge); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.lobby-card h3 { margin: 0; }
.code-in { text-transform: uppercase; letter-spacing: .3em; font-family: var(--display) !important; font-size: 32px !important; text-align: center; }
.room-code { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--edge); border-radius: 10px; padding: 12px 16px; }
.room-code .acc-label { width: 100%; }
.room-code b { font-family: var(--display); font-weight: 400; font-size: 64px; line-height: .9; letter-spacing: .12em; color: var(--gold); }
.players { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; margin-top: 14px; }
.pcard { background: var(--edge); border-radius: 10px; padding: 12px; display: grid; gap: 2px; min-width: 0; }
.pcard small { font-size: 11px; letter-spacing: .14em; color: var(--dim); }
.pcard b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard span { font-size: 12px; color: var(--dim); }
.pcard.me { box-shadow: inset 0 0 0 2px var(--gold); }
.pcard.empty b { color: var(--dim); animation: blink 1.2s steps(2) infinite; }
.vs { font-family: var(--display); font-size: 28px; color: var(--red); }
.wait-dots { margin: 0; align-self: center; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab { font-family: var(--display); font-size: 22px; background: var(--edge); color: var(--dim); border: 3px solid var(--edge); border-radius: 8px; padding: 4px 14px; }
.tab.on { background: var(--gold); color: var(--edge); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { font-size: 12px; letter-spacing: .1em; background: var(--edge); color: var(--dim); border: 2px solid var(--panel-hi); border-radius: 20px; padding: 5px 12px; }
.chip.on { color: var(--ink); border-color: var(--gold); }
.tbl.lb tr.me td { background: rgba(255, 184, 61, .12); }
.tbl.lb small { color: var(--dim); }
.lb-body { min-height: 120px; }
.lbcats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.lbcat { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 46px; padding: 6px 4px; background: var(--edge); color: var(--dim); border: 2px solid var(--panel-hi); border-radius: 8px; font: inherit; cursor: pointer; line-height: 1.15; text-align: center; }
.lbcat b { font-size: 13px; letter-spacing: .04em; font-weight: 700; }
.lbcat i { font-style: normal; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.lbcat:hover { color: var(--ink); border-color: var(--dim); }
.lbcat.on { color: var(--ink); border-color: var(--gold); background: rgba(255, 184, 61, .14); }
.lbcat.on i { color: var(--gold); opacity: 1; }
.warn code { font-size: 11px; word-break: break-word; }
.lb-retry { background: none; border: 0; padding: 0; margin-top: 8px; font: inherit; color: var(--gold); text-decoration: underline; cursor: pointer; }
#countdown { position: fixed; inset: 0; z-index: 26; display: grid; place-items: center; background: rgba(6, 4, 16, .55); pointer-events: none; }
#countdown b { font-family: var(--display); font-weight: 400; font-size: 220px; color: var(--gold); text-shadow: 0 10px 0 var(--edge); animation: cd .8s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes cd { 0% { transform: scale(2.2); opacity: 0; } 60% { transform: scale(1); opacity: 1; } }
.oppbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 3px solid var(--edge); border-radius: 10px; box-shadow: 0 4px 0 var(--edge); padding: 8px 12px; margin: 4px 0 6px; }
.opp-tag { font-family: var(--display); font-size: 20px; background: var(--red); border-radius: 6px; padding: 0 8px 2px; }
.opp-name { font-family: var(--display); font-weight: 400; font-size: 24px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12ch; }
.opp-round { font-size: 12px; color: var(--dim); }
.pips { display: flex; gap: 3px; }
.pips i { width: 10px; height: 10px; border-radius: 2px; background: var(--edge); border: 1px solid var(--panel-hi); }
.pips i.on { background: var(--good); border-color: var(--good); }
.opp-score { font-family: var(--display); font-size: 24px; margin-left: auto; font-variant-numeric: tabular-nums; }
.opp-status { font-size: 11px; letter-spacing: .12em; color: var(--dim); }
.opp-status.s-cleared, .opp-status.s-finished { color: var(--good); }
.opp-status.s-out, .opp-status.s-forfeit, .opp-status.s-gone { color: var(--bad); }
#burst .card.wait p { margin: 8px 0 0; color: var(--ink); }
.mpres { background: var(--edge); border-radius: 12px; padding: 14px; margin: 6px 0 12px; }
.mp-head { display: grid; gap: 2px; margin-bottom: 10px; }
.mp-head b { font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1; }
.mp-head b.w { color: var(--good); } .mp-head b.l { color: var(--bad); } .mp-head b.p { color: var(--gold); animation: blink 1.2s steps(2) infinite; }
.mp-head span { font-size: 12px; color: var(--dim); }
.mp-cols { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: start; }
.mp-p { background: var(--panel); border-radius: 10px; padding: 10px 12px; display: grid; gap: 3px; min-width: 0; }
.mp-p.won { box-shadow: inset 0 0 0 3px var(--good); }
.mp-p small { font-size: 11px; letter-spacing: .14em; color: var(--dim); }
.mp-p .nm { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-p .sc { font-family: var(--display); font-size: 40px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.mp-p em { font-style: normal; font-size: 12px; color: var(--dim); }
.mp-p code { font-family: var(--body); font-size: 12px; word-break: break-all; color: var(--ink); background: var(--edge); border-radius: 6px; padding: 6px 8px; max-height: 6em; overflow-y: auto; }

.diag { margin-top: 16px; font-size: 12px; color: var(--dim); }
.diag summary { cursor: pointer; }
.diag pre { background: var(--edge); border-radius: 8px; padding: 10px; max-height: 180px; overflow: auto; font-size: 11px; white-space: pre-wrap; color: var(--ink); user-select: text; }
/* ---------- V8 ---------- */
.btn.orange { background: #ff8a2b; color: var(--edge); text-shadow: none; }
.playwrap { display: grid; }
.playsplit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; animation: splitin .35s cubic-bezier(.2,1.6,.4,1); }
.playsplit .btn { font-size: 30px; padding-inline: .3em; }
@keyframes splitin { 0% { transform: scaleX(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.version { margin-top: 6px; background: none; border: 0; color: var(--dim); font-size: 12px; letter-spacing: .12em; }
.version:hover u { color: var(--gold); }
.notes { display: grid; gap: 10px; max-height: 60vh; overflow-y: auto; }
.note-v { background: var(--edge); border-radius: 10px; padding: 12px 14px; }
.note-v h3 { margin: 0 0 6px; font-size: 26px; }
.note-v h3 small { font-family: var(--body); font-size: 12px; color: var(--dim); margin-left: 8px; }
.note-v ul { margin: 0; padding-left: 1.1em; }
.note-v li { font-size: 13px; line-height: 1.5; }
.modechip { display: inline-block; font-family: var(--display); font-size: 16px; color: var(--edge); background: var(--gold); border-radius: 6px; padding: 1px 8px 2px; vertical-align: 4px; letter-spacing: .04em; }
.modechip.m-dropout { background: #ff8a2b; } .modechip.m-score, .modechip.m-race, .modechip.m-ko { background: var(--good); }
#timeOut.capped { color: var(--bad) !important; }
.hpwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 2px 0 6px; }
.hp { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; background: var(--panel); border: 3px solid var(--edge); border-radius: 10px; padding: 6px 10px; min-width: 0; }
.hp small { font-size: 11px; letter-spacing: .12em; color: var(--dim); max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hp b { font-family: var(--display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.hpbar { height: 12px; background: var(--edge); border-radius: 6px; overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--good); transition: width .6s cubic-bezier(.3,1.4,.5,1); }
.hp.opp .hpbar i { background: var(--red); }
.hpwrap.hit { animation: no .3s; }
#burst .card.ko p, #burst .card.drop p { margin: 8px 0 0; color: var(--ink); }
.dmg-out { color: var(--good); } .dmg-in { color: var(--bad); }
.hp-mini { display: flex; gap: 14px; justify-content: center; margin-top: 8px; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.drop-score small { font-size: 12px; letter-spacing: .14em; color: var(--dim); }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.mode-opt { text-align: left; background: var(--edge); border: 3px solid var(--edge); border-radius: 10px; padding: 10px; color: var(--ink); display: grid; gap: 4px; align-content: start; }
.mode-opt b { font-family: var(--display); font-weight: 400; font-size: 24px; }
.mode-opt span { font-size: 12px; color: var(--dim); line-height: 1.4; }
.mode-opt.on { border-color: var(--gold); }
.mode-opt.static { grid-column: 1 / -1; }
.chip i { font-style: normal; color: var(--dim); font-size: 10px; }
.tbl.lb tr.lbrow { cursor: pointer; }
.tbl.lb tr.lbrow:hover td, .tbl.lb tr.lbrow:focus td { background: rgba(255,255,255,.06); }
.achbar { height: 6px; background: var(--edge); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.achbar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.ach .achnum { display: block; font-size: 11px; color: var(--gold); margin-top: 3px; font-variant-numeric: tabular-nums; }
.ach.locked.revealed .achbar { background: var(--panel-hi); }
.acc-body { align-items: stretch; }
.acc-left { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.acc-achcol { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 460px; }
.ach-scroll { position: relative; flex: 1 1 auto; }
.ach-scroll > .achs.one { position: absolute; inset: 0; max-height: none; }
.scores-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.scores-grid h4 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--ink); }
.scores-grid .tbl td, .scores-grid .tbl th { padding: 6px; }
.profile .pf-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.pf-name { font-family: var(--display); font-size: 52px; line-height: .95; overflow-wrap: anywhere; }
.pf-medals { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 14px; }
.medal.sm .disc { width: 50px; height: 50px; }
.medal.sm b { font-size: 12px; }
.pf-achs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ach.mini { grid-template-columns: 34px 1fr; padding: 6px 8px; gap: 8px; }
.ach.mini .emblem { width: 34px; height: 37px; }
.ach.mini b { font-size: 12px; }
.esc-hint { font-size: 12px; color: var(--dim); }

.progress { color: var(--dim); font-size: 14px; margin: -4px 0 14px; }

@media (max-width: 860px) {
  .acc-head { grid-template-columns: minmax(0, 1fr); }
  .acc-body { grid-template-columns: minmax(0, 1fr); }
  .achs.one { max-height: 480px; }
  .acc-achcol { min-height: 0; }
  .ach-scroll > .achs.one { position: static; max-height: 480px; }
}
@media (max-width: 520px) {
  .hud b { font-size: 28px; }
  .hud .hud-time b { font-size: 64px; }
  #app { padding-block: 62px 48px; }
  .rule { grid-template-columns: auto 1fr; }
  .rule .mark { position: absolute; top: 8px; right: 10px; font-size: 22px; }
  .rule .txt { padding-right: 18px; }
  .sheet h2 { font-size: 42px; }
  .sheet h2.result.long { font-size: 32px; }
  .corner { font-size: 17px; }
  .stat b { font-size: 30px; }
  .achs { grid-template-columns: 1fr; }

/* ===================== RULE DEFINITIONS ===================== */

function listRule(id, text, hint, list) {
  return {
    id, name: text,
    make: () => ({ text, hint, check: c => !!matchList(list, c.n), examples: () => sample(list, 4) }),
    answers: () => list.map(e => e.display)
  };
}
function simple(id, text, hint, check, answers) {
  return { id, name: text, make: () => ({ text, hint, check, examples: () => answers.slice(0, 4) }), answers: () => answers };
}

function rockAge() {
  const now = new Date();
  let age = now.getFullYear() - 1972;
  if (now.getMonth() < 4 || (now.getMonth() === 4 && now.getDate() < 2)) age--;
  return age;
}

function keyCheck(c, pc) {
  const raw = c.raw.replace(/♯/g, '#').replace(/♭/g, 'b');
  for (const name of NOTE_NAMES[pc]) {
    const letter = name[0], acc = name[1];
    if (!acc) {
      if (new RegExp(letter + '(?![#b])').test(raw)) return true;
    } else {
      if (raw.includes(letter + acc)) return true;
      if (c.n.includes(letter.toLowerCase() + NOTE_WORDS[acc])) return true;
    }
  }
  return false;
}

/* ===================== SCORING ===================== */
function roundScore(ruleCount, timeLeft, length) {
  const timeF = 0.5 + timeLeft / 120;
  const eff = Math.max(0.5, Math.min(2, (8 * ruleCount) / Math.max(1, length)));
  return { points: Math.round(180 * ruleCount * timeF * eff), timeF, eff };
}

function fmtRun(sec) {

function fmtLong(sec) {

/* ---------- Drop Out ---------- */
function dropScores() { return store.get('pg.dropScores', []) || []; }
function dropBest() { return dropScores().reduce((m, d) => Math.max(m, d.round || 0), 0); }
function dropEnd() {
  S.phase = 'over'; S.lastWin = false;
  S.playTime += S.roundLen;
  if (!music.jingle('lose')) sfx.fail();
  const reached = S.round, cleared = S.round - 1, date = new Date().toISOString().slice(0, 10);
  const prevBest = dropBest();
  const list = dropScores(); list.push({ round: reached, date, time: Math.round(S.playTime * 10) / 10 });
  list.sort((a, b) => b.round - a.round || a.time - b.time); store.set('pg.dropScores', list.slice(0, 10));
  const st = baseStats();
  S.prevMedalVals = MEDALS.map(m => m.value(st));
  st.time = (st.time || 0) + S.playTime; st.chars = (st.chars || 0) + S.chars;
  st.drop = st.drop || { games: 0, best: 0, rounds: 0 };
  st.drop.games++; st.drop.rounds += cleared; st.drop.best = Math.max(st.drop.best, reached);
  store.set('pg.stats', st); statsMem = st;
  S.pending.add('dropout'); if (reached >= 20) S.pending.add('hurry');
  S.rewards = endRewards(false, st, { base: Math.min(1200, 50 * cleared), baseLabel: cleared === 1 ? '1 round' : cleared + ' rounds' });
  lbPushSoon();
  const { missed, html } = missedHTML();
  openModal(`
    <h2 class="result">DROPPED OUT</h2>
    ${prevBest && reached > prevBest ? '<span class="tag">NEW BEST</span>' : ''}
    <div id="resultInfo"><div class="drop-score"><small>YOU REACHED ROUND</small><div class="big-score">${reached}</div></div>
    <div class="runline"><span><small>RUN TIME</small><b>${fmtRun(S.playTime)}</b></span><span><small>BEST</small><b>${Math.max(prevBest, reached)}</b></span><span><small>LAST ROUND</small><b>${S.roundLen}s</b></span></div>
    ${xpLineHTML(S.rewards)}</div>
    <h3>Rules that got you</h3>
    <div class="failed">${html}</div>
    <div class="row"><button class="btn orange" data-act="play-drop" type="button">TRY AGAIN</button><button class="btn" data-act="menu" type="button">MENU</button></div>`);
  fillMissed(missed);
}

function newCode() { let c = ''; for (let i = 0; i < 4; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return c; }

async function joinRoom(code, asHost) {

  const topic = 'pg-room-' + code;
  Object.assign(MP, { code, host: asHost, status: 'connecting', opp: null, joinedAt: Date.now(), where: 'lobby', match: null, msg: '', goneAt: 0, oppSeen: 0 });
  mpLog(`${asHost ? 'creating' : 'joining'} room ${code}`);
  renderLobby();

  try { for (const old of (c.getChannels ? c.getChannels() : [])) if (old.topic === 'realtime:' + topic) { mpLog('removing stale channel'); await c.removeChannel(old); } } catch (e) {}

function myInfo() {

    'Esc closes windows, goes back, or quits the game (press twice).', '1v1 Online is now called PvP. The Highscore button is gone.',
    'Fixed: the score from your last game showed in a new game until it changed.']],

  ['V7', 'Online', ['1v1 multiplayer with room codes: same rules, same time.', 'Global leaderboard.', 'Self-hostable with Supabase.', '3 PvP achievements and PvP stats.']],

    'Account layout reworked. Title editing moved into Edit.', 'Red ! markers and notifications for new rules and titles.', 'Fixed the broken level-up popup.']],
  ['V5', 'Level Up', ['Accounts: username, title, XP and levels.', '4 medals with 11 levels, colors and titles.', '14 new rules (67 in total).',
    '7 new achievements.', 'First-time tutorial.', 'Background bright patches toned down.']],
  ['V4', 'Polish', ['Much slower background.', 'Quit button.', 'Run time and password length on the results.', 'Fire dies out under 1 minute; FX quality setting.',
    '4 new statistics and 6 new achievements.', 'Random victory and defeat titles.', 'Menu reordered.']],
  ['V3', 'Achievement Hunter', ['11 achievements with hexagon emblems and pop-up notifications.', 'Win streak and games won/lost statistics.', 'Easier-to-read fonts.']],
  ['V2', 'Fair Play', ['Fixed the false "new highscore" badge.', 'Rule hints explain the format instead of giving answers away.', 'Statistics screen.']],
  ['V1', 'First Password', ['The (New and improved) Password Game: 5 rounds, 2 new rules a round, 54 rules, scoring, flames and a retro look.', 'Discovered rules and highscores.']]

function openNotes() {
  sfx.click();
  openModal(`<h2>PATCH NOTES</h2><p class="progress">You're playing ${VERSION}.</p><div class="notes">${PATCH_NOTES.map(([v, name, items]) =>
    `<section class="note-v"><h3>${v} · ${escapeHtml(name)}${v === VERSION ? '<small>CURRENT</small>' : ''}</h3><ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul></section>`).join('')}</div>
    <div class="row"><button class="btn dark" data-act="close" type="button">CLOSE</button></div>`);
}

/* ---------- "new" markers ---------- */
function unlockedTitleKeys() { const k = []; for (const m of MEDALS) for (let l = 1; l <= (acct.medals[m.id] || 0); l++) k.push(m.id + ':' + l); return k; }
let seen = store.get('pg.seen', null);
function initSeen() {
  if (!seen) { seen = { rules: [...discovered], titles: unlockedTitleKeys(), ach: Object.keys(unlocked) }; store.set('pg.seen', seen); }
}
const unseenRules = () => [...discovered].filter(id => !seen.rules.includes(id));
const unseenTitles = () => unlockedTitleKeys().filter(k => !seen.titles.includes(k));
const unseenAch = () => Object.keys(unlocked).filter(id => !seen.ach.includes(id));
function markSeen(kind, list) { seen[kind] = [...new Set([...seen[kind], ...list])]; store.set('pg.seen', seen); renderMenuStats(); }

function renderMenuStats() {
  if (seen) {
    $('dotDisc').hidden = !unseenRules().length;
    $('dotAcc').hidden = !(unseenTitles().length || unseenAch().length);
    $('dotEdit').hidden = !unseenTitles().length;
  }
  if (typeof acct !== 'undefined') {
    const lv = levelInfo(acct.xp).lvl, ti = titleInfo(acct.title);
    $('accSmall').textContent = 'LVL ' + lv;
    $('menuPlayer').innerHTML = `<b>${escapeHtml(acct.name)}</b>${ti ? ' · ' + escapeHtml(ti.text) : ''} · Level ${lv}`;
  }
  $('discCount').textContent = discovered.size + '/' + RULES.length;
}

let splitTimer = 0;
function collapsePlay() { clearTimeout(splitTimer); if ($('playSplit')) { $('playSplit').hidden = true; $('play').hidden = false; } }
function armSplit(ms) { clearTimeout(splitTimer); splitTimer = setTimeout(() => { if ($('playSplit').matches(':hover')) return armSplit(1500); collapsePlay(); }, ms); }
$('play').onclick = () => { sfx.click(); $('play').hidden = true; $('playSplit').hidden = false; $('playStd').focus(); armSplit(4000); };
$('playStd').onclick = () => startGame({ mode: 'standard' });
$('playDrop').onclick = () => startGame({ mode: 'dropout' });
document.addEventListener('click', e => { if (!$('playSplit').hidden && !e.target.closest('#playWrap')) collapsePlay(); });
$('howBtn').onclick = () => { sfx.click(); openModal(`
  <h2>HOW TO PLAY</h2>
  <ol>
    <li>There are <b>5 rounds</b>. Each round adds <b>2 new random rules</b>, so the last round has 10.</li>
    <li>You have <b>2:00</b> per round to make your password follow <b>every</b> rule.</li>
    <li>When every rule is green, press <b>Enter</b> (or Lock in) to bank your points. The clock resets.</li>
    <li>Your password carries over. Old rules can break again if you edit it.</li>
    <li>If the clock hits 0:00, the run is over.</li>
  </ol>
  <h3>Game modes</h3>
  <p><b>Standard</b> is the game described above. <b>Drop Out</b> is endless: every round gives 3 brand-new rules and a fresh password, starting with 1 minute and getting 5 seconds shorter every 2 rounds (down to 10 seconds). Your score is the round you reach. <b>PvP</b> lets you play a friend in <b>Score</b>, <b>Race</b> or <b>Knockout</b>.</p>
  <h3>Spelling is forgiving</h3>
  <p>Case, spaces, hyphens and accents don't matter: <i>Under the Dome</i>, <i>UnderTheDome</i> and <i>under-the-dome</i> all count. Numbers hidden inside longer numbers count too (1942 contains 42). A few rules ask for a specific format, and their card tells you how.</p>
  <h3>Scoring</h3>
  <div class="formula">180 × rules × time bonus × length bonus</div>
  <p><b>Time bonus</b> = 0.5 + seconds left ÷ 120 (from ×0.5 up to ×1.5).<br><b>Length bonus</b> = (8 × rules) ÷ password length, between ×0.5 and ×2. Short, clever passwords that reuse words for several rules score big.</p>
  <p>Clear a round with more than a minute left and the floor catches fire. Keep the streak going and the fire grows. It dies out when less than a minute is left.</p>
  <h3>Account</h3>
  <p>Wins give XP (more for fast runs with short passwords). Achievements give 2,000 XP, medal levels 5,000 XP and rainbow medals another 10,000 XP. Medal levels unlock titles you can show in your Account.</p>
  <div class="row"><button class="btn red" data-act="play" type="button">PLAY STANDARD</button><button class="btn" data-act="tutorial" type="button">REPLAY TUTORIAL</button><button class="btn dark" data-act="close" type="button">CLOSE</button></div>`); };

$('discBtn').onclick = () => {
  sfx.click();
  const fresh = new Set(unseenRules());
  const items = RULES.map(r => {
    if (!discovered.has(r.id)) return `<div class="disc-item locked"><header><span>? ? ? ? ? ?</span></header></div>`;
    let ans = [];
    try { ans = r.answers(); } catch (e) {}
    const body = ans.length > 60 ? `<p>${ans.map(escapeHtml).join(', ')}</p>` : ans.map(a => `<p>${escapeHtml(a)}</p>`).join('');
    return `<div class="disc-item"><header><span>${escapeHtml(r.name)}${fresh.has(r.id) ? '<span class="newtag">NEW</span>' : ''}</span><button type="button" data-act="answers">Show answers</button></header><div class="answers" hidden>${body}</div></div>`;
  }).join('');
  openModal(`<h2>DISCOVERED RULES</h2><p class="progress">${discovered.size} of ${RULES.length} rules found. Rules with variants show every variant's answer.</p><div class="disc">${items}</div><div class="row"><button class="btn dark" data-act="close" type="button">CLOSE</button></div>`);
  markSeen('rules', [...fresh]);
};

$('mpBtn').onclick = () => openLobby();
$('lbBtn').onclick = () => openBoards(lastBoard);
$('verBtn').onclick = openNotes;

/* ---------- input ---------- */
const pwEl = $('pw');
pwEl.addEventListener('input', () => {
  if (/[\r\n]/.test(pwEl.value)) { const p = pwEl.selectionStart; pwEl.value = pwEl.value.replace(/[\r\n]+/g, ''); pwEl.selectionStart = pwEl.selectionEnd = Math.max(0, p - 1); }
  autosize();
  if (S.phase === 'playing' || S.phase === 'between') evaluate(false);
});
pwEl.addEventListener('beforeinput', e => {
  if (S.phase !== 'playing' && S.phase !== 'between') return;
  if ((e.inputType === 'insertText' || e.inputType === 'insertReplacementText') && e.data) S.chars += [...e.data].length;
});
pwEl.addEventListener('compositionend', e => { if ((S.phase === 'playing' || S.phase === 'between') && e.data) S.chars += [...e.data].length; });
pwEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lockIn(); } });
$('lock').onclick = () => { lockIn(); pwEl.focus(); };

/* ---------- main loop ---------- */
let lastFrame = performance.now(), lastBg = 0, bgT = 0, slowAcc = 0, autoLowered = false;
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  if (S.phase === 'playing' && !S.paused) {
    S.timeLeft = S.roundLen - (now - S.roundStart) / 1000;
    S.dispLeft = S.capAt ? Math.min(S.timeLeft, (S.capAt - now) / 1000) : S.timeLeft;
    const secs = Math.ceil(S.dispLeft);
    $('timeOut').textContent = fmtTime(S.dispLeft);
    $('timeBox').classList.toggle('hurry', S.dispLeft < Math.min(20, S.roundLen / 3));
    if (secs <= Math.min(15, S.roundLen / 2) && secs < S.lastTick && secs > 0) { S.lastTick = secs; if (!music.playing()) sfx.tick(); }
    if (S.dispLeft <= 0) timeUp();
  }
  // "Are you still there?": the menu, untouched by modals, for 5 minutes straight
  if (!$('menu').hidden && $('modal').hidden && !TUT.on && document.visibilityState === 'visible') { S.menuIdle += dt; if (S.menuIdle >= 300 && !unlocked.stillthere) award('stillthere'); }
  else S.menuIdle = 0;
  // heat target
  let target;
  if (S.phase === 'playing') target = 1 - Math.max(0, S.dispLeft) / S.roundLen;
  else if (S.phase === 'between' || S.phase === 'waiting') target = 0;
  else if (S.phase === 'over') target = S.lastWin ? .15 : 1;
  else target = .06 + .05 * Math.sin(now / 3000);
  heatShown += (target - heatShown) * .04;
  const h = Math.max(0, Math.min(1, heatShown));
  $('timeOut').style.color = mixHex('cfd9ff', 'ffb45a', h);
  // score count-up
  if (S.shownScore !== S.score) {
    S.shownScore = Math.abs(S.score - S.shownScore) < 2 ? S.score : lerp(S.shownScore, S.score, .12);
    $('scoreOut').textContent = nf(S.shownScore);
  }
  // draw
  bgT += dt * (0.1 + 0.2 * h);
  const Q = QUAL[quality];
  // slow devices: drop to LOW once if HIGH can't keep ~28 fps during play
  if (quality === 'high' && !autoLowered && S.phase === 'playing') {
    slowAcc = Math.max(0, slowAcc + (dt > 1 / 28 ? dt : -dt * .5));
    if (slowAcc > 4) { autoLowered = true; setQuality('low'); toastInfo('EFFECTS LOWERED', 'Effects set to LOW to keep the game smooth. Change it with the FX button.'); }
  }
  if (now - lastBg < 1000 / Q.bgFps - 2) { /* skip background this frame */ }
  else if (gl) { lastBg = now; gl.uniform2f(uRes, bg.width, bg.height); gl.uniform1f(uT, bgT); gl.uniform1f(uHeat, h); gl.drawArrays(gl.TRIANGLES, 0, 6); }
  else if (bg2d) { lastBg = now; const g = bg2d.createLinearGradient(0, 0, bg.width, bg.height); g.addColorStop(0, mixHex('241e66', '7a2410', h)); g.addColorStop(1, mixHex('3a6fd8', 'f29a35', h)); bg2d.fillStyle = g; bg2d.fillRect(0, 0, bg.width, bg.height); }
  drawFlames(h, dt);
  if (TUT.on) tutLayout();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
migrateAcct();
initSeen();
renderMenuStats();
if (getStats().games) setTimeout(lbPushSoon, 4000);
{ const tut = store.get('pg.tut', null); if (tut === 'running' || (tut !== 'done' && !getStats().games)) setTimeout(tutStart, 700); }
})();
</script>
